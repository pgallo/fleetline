name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: C++ core (CMake + ctest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev cmake g++ pybind11-dev
      - name: Configure
        run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/core -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build/core --output-on-failure

  python:
    name: Python layer (extension + pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev cmake g++ pybind11-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Test
        run: .venv/bin/pytest
      - name: Demo smoke run
        run: .venv/bin/python -m fleetline.demo --vehicles 6 --hours 4
